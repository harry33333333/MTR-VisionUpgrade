plugins {
	id 'fabric-loom' version '1.9.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://cursemaven.com" }
	maven { url = "https://api.modrinth.com/maven/" }
	maven { url = "https://repo.codemc.org/repository/maven-public" }
	flatDir {
		dirs 'libs'
	}
	maven { url = "https://maven.shedaniel.me/" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MTR dependency (compile against MTR 4.0.5)
	modCompileOnly "curse.maven:mtr-266707:8244919"

	// Optional Iris for Mixins
	modCompileOnly "curse.maven:iris-455508:6258195"

	// Optional Cloth Config & ModMenu for Config Screen
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:11.1.118") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modCompileOnly("com.terraformersmc:modmenu:7.2.2")

	testImplementation "curse.maven:mtr-266707:8244919"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "fabric_version", project.fabric_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version,
				"fabric_version": project.fabric_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
